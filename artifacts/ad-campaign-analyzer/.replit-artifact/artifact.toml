kind = "data-app"
previewPath = "/dashboard"
title = "Ad Campaign Performance Analyzer"
version = "1.0.0"
id = "artifacts/ad-campaign-analyzer"
router = "path"

[[services]]
name = "web"
paths = [ "/dashboard" ]
localPort = 26198

[services.development]
run = "pnpm --filter @workspace/ad-campaign-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ad-campaign-analyzer", "run", "build" ]
serve = "static"
publicDir = "artifacts/ad-campaign-analyzer/dist/public"

[[services.production.rewrites]]
from = "/dashboard/*"
to = "/dashboard/index.html"

[services.env]
PORT = "26198"
BASE_PATH = "/dashboard"

[[services]]
name = "streamlit"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "bash /home/runner/workspace/streamlit_app/run.sh"

[services.env]
PORT = "5000"
BASE_PATH = "/"
